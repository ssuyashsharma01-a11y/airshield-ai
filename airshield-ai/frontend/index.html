<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  
    <style id="airshield-hard-print-isolation">
      @media screen {
        #audit-pdf-print-root {
          display: none !important;
        }
      }
      @media print {
        @page {
          size: A4 portrait;
          margin: 8mm;
        }
        body, html {
          background-color: #ffffff !important;
          color: #0f172a !important;
          margin: 0 !important;
          padding: 0 !important;
          visibility: visible !important;
        }
        /* Hide regular UI elements inside React root */
        #root > *:not(#audit-pdf-print-root),
        header, nav, aside {
          display: none !important;
        }
        /* Make audit report completely visible with solid colors */
        #audit-pdf-print-root {
          display: block !important;
          visibility: visible !important;
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          color: #0f172a !important;
          background: #ffffff !important;
          padding: 10px !important;
          box-sizing: border-box !important;
        }
        #audit-pdf-print-root * {
          visibility: visible !important;
          color: #0f172a !important;
        }
        #audit-pdf-print-root span,
        #audit-pdf-print-root h1,
        #audit-pdf-print-root h3 {
          color: #0284c7 !important;
        }
      }
    </style>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
